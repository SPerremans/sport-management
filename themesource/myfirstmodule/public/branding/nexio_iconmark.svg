<svg width="400" height="400" viewBox="0 0 400 400" xmlns="http://www.w3.org/2000/svg" role="img">
  <title>Nexio — Icon Mark</title>
  <desc>Nexio CRM standalone circular icon mark. Slate-blue circle with sky-teal segmented discipline ring, six connected member nodes, and central person figure.</desc>

  <!-- Background (transparent friendly) -->
  <rect width="400" height="400" fill="none"/>

  <g transform="translate(200, 200)">

    <!-- Outer subtle glow -->
    <circle cx="0" cy="0" r="185" fill="#0A1E38" fill-opacity="0.08"/>

    <!-- Main circle -->
    <circle cx="0" cy="0" r="175" fill="#0F2D52"/>

    <!-- Segmented discipline ring — 6 arcs -->
    <circle cx="0" cy="0" r="162" fill="none" stroke="#38BDF8" stroke-width="11" stroke-dasharray="112 18" stroke-dashoffset="0"/>

    <!-- Inner ring accent -->
    <circle cx="0" cy="0" r="146" fill="none" stroke="#38BDF8" stroke-width="1" stroke-opacity="0.15"/>
    <circle cx="0" cy="0" r="136" fill="none" stroke="#1565C0" stroke-width="1" stroke-opacity="0.3"/>

    <!-- 6 spokes -->
    <line x1="0"      y1="-136" x2="0"      y2="-82"  stroke="#38BDF8" stroke-width="3"   stroke-opacity="0.65" stroke-linecap="round"/>
    <line x1="117.7"  y1="-68"  x2="71"     y2="-41"  stroke="#38BDF8" stroke-width="3"   stroke-opacity="0.65" stroke-linecap="round"/>
    <line x1="117.7"  y1="68"   x2="71"     y2="41"   stroke="#38BDF8" stroke-width="3"   stroke-opacity="0.65" stroke-linecap="round"/>
    <line x1="0"      y1="136"  x2="0"      y2="82"   stroke="#38BDF8" stroke-width="3"   stroke-opacity="0.65" stroke-linecap="round"/>
    <line x1="-117.7" y1="68"   x2="-71"    y2="41"   stroke="#38BDF8" stroke-width="3"   stroke-opacity="0.65" stroke-linecap="round"/>
    <line x1="-117.7" y1="-68"  x2="-71"    y2="-41"  stroke="#38BDF8" stroke-width="3"   stroke-opacity="0.65" stroke-linecap="round"/>

    <!-- 6 member nodes -->
    <circle cx="0"      cy="-136" r="17" fill="#1565C0"/>
    <circle cx="117.7"  cy="-68"  r="17" fill="#1565C0"/>
    <circle cx="117.7"  cy="68"   r="17" fill="#1565C0"/>
    <circle cx="0"      cy="136"  r="17" fill="#1565C0"/>
    <circle cx="-117.7" cy="68"   r="17" fill="#1565C0"/>
    <circle cx="-117.7" cy="-68"  r="17" fill="#1565C0"/>

    <!-- Person heads on nodes -->
    <circle cx="0"      cy="-145" r="9.5" fill="white"/>
    <circle cx="117.7"  cy="-77"  r="9.5" fill="white"/>
    <circle cx="117.7"  cy="59"   r="9.5" fill="white"/>
    <circle cx="0"      cy="127"  r="9.5" fill="white"/>
    <circle cx="-117.7" cy="59"   r="9.5" fill="white"/>
    <circle cx="-117.7" cy="-77"  r="9.5" fill="white"/>

    <!-- Hub outer ring -->
    <circle cx="0" cy="0" r="72" fill="#1565C0"/>
    <circle cx="0" cy="0" r="62" fill="#0F2D52"/>

    <!-- Central connected person -->
    <circle cx="0" cy="-20" r="20" fill="#38BDF8"/>
    <path d="M-24,6 Q-30,42 0,45 Q30,42 24,6 Q14,-10 0,-10 Q-14,-10 -24,6 Z" fill="#38BDF8"/>
    <!-- Brotherhood arc -->
    <path d="M-28,47 Q0,62 28,47" fill="none" stroke="#38BDF8" stroke-width="4" stroke-linecap="round" stroke-opacity="0.5"/>

  </g>

</svg>
