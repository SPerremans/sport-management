<svg width="512" height="512" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg" role="img">
  <title>Nexio — App Icon</title>
  <desc>Nexio CRM app icon. Deep navy rounded square with slate-blue circular icon mark inside — for use as mobile app icon, favicon, or avatar.</desc>

  <!-- Rounded square background -->
  <rect width="512" height="512" rx="112" fill="#0A1E38"/>

  <!-- Subtle inner border -->
  <rect x="2" y="2" width="508" height="508" rx="110" fill="none" stroke="#38BDF8" stroke-width="1" stroke-opacity="0.15"/>

  <g transform="translate(256, 256)">

    <!-- Main circle -->
    <circle cx="0" cy="0" r="196" fill="#0F2D52"/>

    <!-- Segmented discipline ring -->
    <circle cx="0" cy="0" r="182" fill="none" stroke="#38BDF8" stroke-width="12" stroke-dasharray="118 22" stroke-dashoffset="0"/>

    <!-- Inner ring -->
    <circle cx="0" cy="0" r="164" fill="none" stroke="#38BDF8" stroke-width="1" stroke-opacity="0.15"/>

    <!-- 6 spokes -->
    <line x1="0"      y1="-164" x2="0"      y2="-98"  stroke="#38BDF8" stroke-width="3.5" stroke-opacity="0.65" stroke-linecap="round"/>
    <line x1="142"    y1="-82"  x2="85"     y2="-49"  stroke="#38BDF8" stroke-width="3.5" stroke-opacity="0.65" stroke-linecap="round"/>
    <line x1="142"    y1="82"   x2="85"     y2="49"   stroke="#38BDF8" stroke-width="3.5" stroke-opacity="0.65" stroke-linecap="round"/>
    <line x1="0"      y1="164"  x2="0"      y2="98"   stroke="#38BDF8" stroke-width="3.5" stroke-opacity="0.65" stroke-linecap="round"/>
    <line x1="-142"   y1="82"   x2="-85"    y2="49"   stroke="#38BDF8" stroke-width="3.5" stroke-opacity="0.65" stroke-linecap="round"/>
    <line x1="-142"   y1="-82"  x2="-85"    y2="-49"  stroke="#38BDF8" stroke-width="3.5" stroke-opacity="0.65" stroke-linecap="round"/>

    <!-- 6 member nodes -->
    <circle cx="0"    cy="-164" r="20" fill="#1565C0"/>
    <circle cx="142"  cy="-82"  r="20" fill="#1565C0"/>
    <circle cx="142"  cy="82"   r="20" fill="#1565C0"/>
    <circle cx="0"    cy="164"  r="20" fill="#1565C0"/>
    <circle cx="-142" cy="82"   r="20" fill="#1565C0"/>
    <circle cx="-142" cy="-82"  r="20" fill="#1565C0"/>

    <!-- Person heads -->
    <circle cx="0"    cy="-175" r="11" fill="white"/>
    <circle cx="142"  cy="-93"  r="11" fill="white"/>
    <circle cx="142"  cy="71"   r="11" fill="white"/>
    <circle cx="0"    cy="153"  r="11" fill="white"/>
    <circle cx="-142" cy="71"   r="11" fill="white"/>
    <circle cx="-142" cy="-93"  r="11" fill="white"/>

    <!-- Hub -->
    <circle cx="0" cy="0" r="86" fill="#1565C0"/>
    <circle cx="0" cy="0" r="74" fill="#0F2D52"/>

    <!-- Central person -->
    <circle cx="0" cy="-24" r="24" fill="#38BDF8"/>
    <path d="M-28,7 Q-35,50 0,54 Q35,50 28,7 Q17,-12 0,-12 Q-17,-12 -28,7 Z" fill="#38BDF8"/>
    <path d="M-33,56 Q0,74 33,56" fill="none" stroke="#38BDF8" stroke-width="5" stroke-linecap="round" stroke-opacity="0.5"/>

  </g>

</svg>
